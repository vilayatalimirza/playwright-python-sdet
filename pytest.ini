[pytest]
# Where tests live. pytest searches here when you run bare `pytest`.
testpaths = tests

# Naming rules for collection. These are the defaults, stated explicitly
# so the convention is documented rather than assumed.
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Flags applied to EVERY run, so you never forget them.
addopts =
    -v
    --strict-markers
    --tb=short
    -p no:cacheprovider

# Custom markers. With --strict-markers, a typo like @pytest.mark.smke
# is a hard ERROR instead of a test that silently never runs.
markers =
    smoke: critical path, fast feedback
    regression: full regression coverage
    ui: browser-driven tests
    api: API-only tests, no browser
    bdd: BDD / Gherkin scenarios
    slow: long-running tests

log_cli = false
log_level = INFO